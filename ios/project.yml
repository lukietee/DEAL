# XcodeGen spec for DEAL. Generate the project with:  cd ios && xcodegen
# Never hand-edit DEAL.xcodeproj; edit this file and regenerate.
name: DEAL

options:
  bundleIdPrefix: com.lucas
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.4   # verified to compile against 2.55.4 (Realtime V2 filter + subscribeWithError APIs)
  MWDAT:
    # Meta Wearables Device Access Toolkit (Ray-Ban Meta Display output). Needs iOS 17.2+.
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"            # app sources also typecheck clean in Swift 6 mode; 5 keeps SPM deps quiet
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DEAL:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: DEAL
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATMockDevice
    entitlements:
      # The Meta wearables SDK keeps its registration token in the app's keychain group.
      path: DEAL/DEAL.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: DEAL/Info.plist
      properties:
        CFBundleDisplayName: DEAL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
          - Sacramento-Regular.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        NSMicrophoneUsageDescription: "DEAL listens to your negotiation to transcribe offers and coach you in real time."
        NSSpeechRecognitionUsageDescription: "DEAL transcribes the conversation on-device to track offers, fees and promises."
        NSCameraUsageDescription: "DEAL uses the camera to scan the buyer's join QR code and to photograph an item so its condition can be checked against the listing."
        NSLocalNetworkUsageDescription: "DEAL connects to the DEAL backend on your local network and to your Meta glasses over Wi-Fi."
        # --- Meta Wearables Device Access Toolkit (Ray-Ban Meta Display output) ---
        # URL scheme Meta AI uses to call DEAL back after registration (keep in sync with MWDAT.AppLinkURLScheme).
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - deal
        MWDAT:
          AppLinkURLScheme: "deal://"
          # Empty / "0" / unexpanded META_APP_ID = Developer Mode (no attestation). For a
          # non-Developer-Mode build, set META_APP_ID + CLIENT_TOKEN (Wearables Developer Center)
          # and DEVELOPMENT_TEAM in the target build settings below. Never commit real values.
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        # The SDK checks Info.plist for each link type (BLE, Bluetooth Classic, Wi-Fi) before using it.
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        NSBluetoothAlwaysUsageDescription: "DEAL uses Bluetooth to show negotiation cues on your Meta glasses."
        NSBonjourServices:
          - _bonjour._tcp
        NSAppTransportSecurity:
          # Plain http to localhost (Simulator), *.local hosts and LAN IPs (http://192.168.x.x:3000).
          # ngrok URLs are https and need no exception.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.deal
        PRODUCT_NAME: DEAL
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SQCY6XBRDY   # Lucas (Personal Team)
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # Meta Wearables Developer Center credentials. Leave empty for Developer Mode.
        # Set locally (Xcode build settings or an uncommitted override), never commit real values.
        META_APP_ID: ""
        CLIENT_TOKEN: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

  # UI smoke tests: drive one phone through the UI, play the other phone over the backend API.
  # Needs the backend running in mock mode. See DEALUITests/DEALFlowUITests.swift.
  DEALUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: DEALUITests
    dependencies:
      - target: DEAL
    info:
      path: DEALUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.deal.uitests
        TEST_TARGET_NAME: DEAL
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SQCY6XBRDY
        GENERATE_INFOPLIST_FILE: NO

schemes:
  DEAL:
    build:
      targets:
        DEAL: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DEALUITests
